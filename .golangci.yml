version: "2"
run:
  concurrency: 2
  issues-exit-code: 1
  tests: false
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - ineffassign
    - lll
    - loggercheck
    - makezero
    - misspell
    - mnd
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only by logutils.Log
    funlen:
      lines: 60
      statements: 40
    nakedret:
      max-func-lines: 60
  exclusions:
    generated: lax
    rules:
      - linters:
          - staticcheck
        path: pkg/step
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: internal/hmac/
        text: weak cryptographic primitive
      - linters:
          - staticcheck
        text: 'SA9003:'
      - linters:
          - staticcheck
        text: 'ST1000:|ST1021:|ST1020:'
      - linters:
          - golint
        text: should have comment
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - gosec
        path: zrc\/pkg\/common\/json\.go
      # Keep pre-existing findings that were not reported by the v1 analyzers
      # scoped to their exact legacy source lines.
      - linters:
          - gocritic
        path: main\.go
        source: 'log\.Fatal\(err\)'
      - linters:
          - gosec
        path: main\.go
        source: 'os\.MkdirAll\(dbDir, os\.ModePerm\)'
      - linters:
          - gosec
        path: main\.go
        source: 'log\.Println\(err\.Error\(\)\)'
      - linters:
          - gosec
        path: pkg/totp/totp\.go
        source: 'binary\.BigEndian\.PutUint64\(data, uint64\(quotient\)\)'
      - path: (.+)\.go$
        text: abcdef
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
